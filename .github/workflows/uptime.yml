name: Uptime check

# Polls the production health endpoint. A failed run emails the repository
# owner (GitHub's default for failed scheduled workflows).
# Set the HEALTHCHECK_URL repository variable to enable it, e.g.
# https://travelo.onrender.com/api/health
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.HEALTHCHECK_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check health endpoint
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        # Retries cover a free-plan instance waking up from sleep
        run: |
          curl -sSf --retry 5 --retry-delay 15 --retry-all-errors --max-time 30 "$HEALTHCHECK_URL"
